<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagramas - Plataforma de Vales Profinsa</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f7fafc;
    }

    header {
      padding: 24px 32px 12px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    nav {
      display: flex;
      gap: 12px;
      padding: 16px 32px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    nav a {
      color: #1168bd;
      font-weight: 700;
      text-decoration: none;
    }

    section {
      padding: 28px 32px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .diagram {
      overflow: auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }

    img {
      display: block;
      max-width: none;
      min-width: 960px;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>Emisor de Vales de Despensa</h1>
  </header>
  <nav>
    <a href="#contexto">Contexto</a>
    <a href="#contenedores">Contenedores</a>
  </nav>
  <section id="contexto">
    <h2>Contexto</h2>
    <div class="diagram">
      <img src="contexto-plataforma-vales.svg" alt="Diagrama de contexto de la Plataforma de Vales Profinsa">
    </div>
  </section>
  <section id="contenedores">
    <h2>Contenedores</h2>
    <div class="diagram">
      <img src="contenedores-plataforma-vales.svg" alt="Diagrama de contenedores de la Plataforma de Vales Profinsa">
    </div>
  </section>
</body>
</html>
